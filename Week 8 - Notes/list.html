<!DOCTYPE html>

<!-- Demonstrates (unordered) lists -->

<html lang="en">
    <head>
        <title>list</title>
    </head>
    <body>
        <!-- Unordered -->
        <ul>
            <li>foo</li>
            <li>bar</li>
            <li>baz</li>
        </ul>

        <!-- Ordered -->
        <ol>
            <li>foo</li>
            <li>bar</li>
            <li>baz</li>
        </ol>
    </body>
</html>
