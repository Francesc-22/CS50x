<!DOCTYPE html>

<!-- Demonstrates image and video -->

<html lang="en">
    <head>
        <title>image and video</title>
    </head>
    <body>
        <img alt="photo of bridge" src="bridge.png">

        <!-- Controls and muted are passed to video -->
        <video controls muted>
            <source src="video.mp4" type="video/mp4">
        </video>
    </body>
</html>
